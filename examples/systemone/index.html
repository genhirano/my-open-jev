<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open-Jev の System One API に手入力したリクエストを送信し、JSON レスポンスを確認します。">
  <title>System One リクエスト · Open-Jev</title>
  <style>
    :root{font:16px/1.6 system-ui,sans-serif;color:#173b31;background:#f3f6f1}
    *{box-sizing:border-box}
    body{margin:0}
    main{max-width:1100px;margin:auto;padding:36px 24px}
    h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin:8px 0}
    h2{font-size:18px;margin:0 0 8px}
    p{margin:8px 0 18px}
    .muted{color:#587168}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
    .panel{min-width:0;padding:22px;background:white;border:1px solid #d5dfd6;border-radius:12px}
    label{display:block;font-weight:650;margin:16px 0 6px}
    input,textarea,button{width:100%;font:inherit;border:1px solid #aebfb1;border-radius:7px;padding:10px}
    input,textarea{background:#fbfcfa;color:#173b31}
    textarea{min-height:220px;resize:vertical;font:13px/1.5 ui-monospace,monospace}
    #state{min-height:120px}
    button{width:auto;margin-top:16px;background:#22513e;color:white;font-weight:650;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #status{min-height:28px;color:#415d50}
    #error{color:#a33625}
    pre{min-height:280px;margin:0;padding:16px;border-radius:8px;background:#14251f;color:#e7f1e8;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,monospace}
    nav a{color:#22513e}
    @media(max-width:720px){main{padding:24px 16px}.grid{grid-template-columns:1fr}}
  </style>
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <nav><a href="/examples/index.html">← Open-Jev examples</a></nav>
    <h1>System One リクエスト</h1>
    <p class="muted">状態と質問を画面に入力して送信します。入力内容はこのページでは保存されません。</p>
    <div class="grid">
      <section class="panel" aria-labelledby="request-title">
        <h2 id="request-title">リクエストを入力</h2>
        <label for="endpoint">API エンドポイント</label>
        <input id="endpoint" type="url" value="/v1/systemone" spellcheck="false">
        <label for="state">状態 (state) · JSON 値</label>
        <textarea id="state" spellcheck="false" placeholder='"例: 注文の配送状況を確認したい。"'></textarea>
        <label for="questions">質問 (questions) · JSON オブジェクト</label>
        <textarea id="questions" spellcheck="false" placeholder='{"配送状況":{"type":"choice","instructions":"問い合わせの内容は何ですか？","criteria":{"配送":"配送に関する質問","その他":"それ以外"}}}'></textarea>
        <button id="send" type="button">リクエストを送信</button>
        <p id="status" role="status" aria-live="polite">state と questions を入力してください。</p>
        <p id="error" role="alert"></p>
      </section>
      <section class="panel" aria-labelledby="response-title">
        <h2 id="response-title">レスポンス JSON</h2>
        <p class="muted">送信後、API の応答を整形して表示します。</p>
        <pre id="response" aria-live="polite">ここにレスポンスが表示されます。</pre>
      </section>
    </div>
  </main>
</body>
</html>
